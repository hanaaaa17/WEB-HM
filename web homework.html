<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Web Design</title>
    <style>
        .header {
            width: 1000px;
            height: 80px;
            background-color: #8484d8;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .nav {
            width: 1000px;
            height: 50px;
            background-color: #6cdceb;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .main{
            width: 700px;
            height: 400px;
            background-color: #8fe8bb;
            border-radius: 15px;
            margin-bottom: 10px;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }
        .article {
            flex: 1;
            height: 200px;
            background-color: #ec617a;
            border-radius: 15px;
            margin-top: 20px;
        }
        .section {
            flex: 1;
            height: 200px;
            background-color: #f5e6a0;
            border-radius: 15px;
            margin-top: 10px;
        }
        .footer {
            width: 1000px;
            height: 80px;
            background-color: #f6a3f4;
            border-radius: 15px;
            margin-top: 10px;
        }
         .aside {
            width: 270px;
            height: 420px;;
            background-color: #28446f;
            border-radius: 15px;
            margin-top: -510px;
            margin-left: 730px;
         }
         aside {
            text-align: center;
            padding-top: 20px;
            font-size: 20px;
            font-weight: bold;
         }
         main {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding-top: 10px;
         }
         nav {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            padding-top: 12px;
         }
            header {
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                padding-top: 25px;
            }
            footer {
                text-align: center;
                font-size: 20px;
                font-weight: bold;
                padding-top: 25px;
            }
         article, section {
            text-align: left;
            font-size: 20px;
            font-weight: bold;
            margin-left: 10px;
            padding-top: 10px;
         }
    </style>
</head>
<body text-align="center">
   <div class="header">
        <header>HEADER</header>
   </div>
   <div class="nav">
        <nav>NAVIGATION</nav>
   </div>
    <div class="main">
        <main>MAIN</main> 
        <div class="article">
            <article>ARTICLE</article>
        </div>
        <div class="section">
            <section>SECTION</section>
        </div>
    </div>
</div>
<div class="footer">
    <footer>FOOTER</footer>
</div>
<div class="aside">
    <aside>ASIDE</aside>
</div>

</body>

</html>
